
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKILL2EARN - Client Test</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #e8f0ff;
      background: #07111f;
    }

    main {
      width: 100%;
      max-width: 620px;
      padding: 28px;
      background: #101e32;
      border: 1px solid #263d5c;
      border-radius: 16px;
    }

    h1 { margin-top: 0; }

    p {
      line-height: 1.6;
      color: #b6c7df;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      padding: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.6;
      border: 1px solid #263d5c;
      border-radius: 9px;
      background: #091526;
    }
  </style>
</head>
<body>
  <main>
    <h1>SKILL2EARN</h1>
    <p>Shared Supabase client diagnostic</p>

    <p>
      This test initializes the shared client and checks whether the
      authentication service responds. It does not create an account,
      insert data, or change database records.
    </p>

    <button id="testButton" type="button">
      Test Shared Client
    </button>

    <div id="result" role="status" aria-live="polite">
      Ready to test.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const button = document.querySelector("#testButton");
    const result = document.querySelector("#result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Testing...";

      try {
        const config = window.SKILL2EARN_SUPABASE_CONFIG;

        if (!config || !config.isConfigured()) {
          throw new Error(
            "Add your new Project URL and publishable key to js/supabase-client.js."
          );
        }

        const client = config.getClient();
        const { data, error } = await client.auth.getSession();

        if (error) {
          throw error;
        }

        result.textContent =
          "PASS: The shared Supabase client initialized successfully.\n" +
          "Authentication session request completed.\n" +
          "Existing session: " +
          (data.session ? "Present" : "None") +
          "\n\nNext: test database access and authentication policies " +
          "before replacing the demo login pages.";
      } catch (error) {
        result.textContent =
          "TEST FAILED\n\n" +
          (error && error.message
            ? error.message
            : "An unexpected error occurred.") +
          "\n\nCheck the project URL, publishable key, internet connection, " +
          "and browser console.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
